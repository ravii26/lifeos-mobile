name: lifeos_mobile
description: "LifeOS — personal life operating system (mobile)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0

  # DI / service locator
  get_it: ^8.0.3

  # Routing
  go_router: ^14.6.2

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Fonts (Hanken Grotesk + JetBrains Mono per design system)
  google_fonts: ^6.2.1

  # Local notifications (habit reminders)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Device IANA timezone, sent on register so the backend computes
  # "today"/streaks/scores in the user's local zone.
  flutter_timezone: ^3.0.1

  # On-device text-to-speech for the floating coach companion
  flutter_tts: ^4.2.0

  # Utilities
  intl: ^0.20.1
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"

  web:
    generate: true

  windows:
    generate: true

  macos:
    generate: true

# Native cold-start splash (shown by the OS before Flutter boots).
# Regenerate after changes with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0B0D"
  image: assets/logo/app_icon.png
  android_12:
    color: "#0A0B0D"
    image: assets/logo/app_icon.png
  color_dark: "#0A0B0D"
  image_dark: assets/logo/app_icon.png
  android: true
  ios: true
  web: true