name: lifeos_mobile
description: "LifeOS — personal life operating system (mobile)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0

  # DI / service locator
  get_it: ^8.0.3

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Fonts (Hanken Grotesk + JetBrains Mono per design system)
  google_fonts: ^6.2.1

  # Local notifications (habit reminders)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Device IANA timezone, sent on register so the backend computes
  # "today"/streaks/scores in the user's local zone.
  flutter_timezone: ^3.0.1

  # On-device text-to-speech for the floating coach companion
  flutter_tts: ^4.2.0

  # Multimodal capture: on-device speech-to-text + photo/gallery.
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  # OS share sheet ("Share" from any app) -> Capture inbox.
  receive_sharing_intent: ^1.9.0

  # Utilities
  intl: ^0.20.1
  rename: ^3.1.0

  # Home-screen widget bridge (Android Glance + iOS WidgetKit shared storage)
  home_widget: ^0.7.0
  # Periodic background refresh of widget data (Android only)
  workmanager: ^0.9.0+3
  # lifeos:// deep link handling (widget taps -> in-app navigation/actions)
  app_links: ^6.3.3
  # Non-sensitive local flags (active focus session marker for the widget)
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"

  web:
    generate: true

  windows:
    generate: true

  macos:
    generate: true

# Native cold-start splash (shown by the OS before Flutter boots).
# Regenerate after changes with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0B0D"
  image: assets/logo/app_icon.png
  android_12:
    color: "#0A0B0D"
    image: assets/logo/app_icon.png
  color_dark: "#0A0B0D"
  image_dark: assets/logo/app_icon.png
  android: true
  ios: true
  web: true